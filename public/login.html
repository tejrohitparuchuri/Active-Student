<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Active Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="glow"></div>

    <div class="w-full max-w-md p-8 rounded-2xl glass-card mx-4 relative z-10 animate-fade-in-up">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold mb-2 text-white tracking-tight">Welcome Back</h1>
            <p class="text-gray-400 text-sm">Sign in to your Active Student account</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-bold text-gray-500 uppercase mb-2">Email Address</label>
                <input type="email" id="email"
                    class="w-full px-4 py-3 rounded-xl input-field text-white placeholder-gray-600"
                    placeholder="student@anurag.edu.in" required>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-gray-500 uppercase mb-2">Password</label>
                <input type="password" id="password"
                    class="w-full px-4 py-3 rounded-xl input-field text-white placeholder-gray-600"
                    placeholder="••••••••" required>
            </div>

            <div id="error-message" class="text-red-500 text-sm text-center hidden"></div>

            <button type="submit" class="w-full btn-primary font-bold py-3.5 rounded-xl mt-4">
                Sign In
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-gray-500 text-sm">
                Don't have an account?
                <a href="register.html" class="text-[#ff9a2c] font-bold hover:underline">Sign Up</a>
            </p>
            <div class="mt-4">
                <a href="index.html" class="text-xs text-gray-600 hover:text-gray-400 transition-colors">← Back to
                    Home</a>
            </div>
        </div>
    </div>

    <!-- Restriction Modal -->
    <div id="restriction-modal"
        class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 backdrop-blur-sm p-4">
        <div
            class="bg-zinc-900 border border-red-500/30 p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl relative">
            <div class="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                    </path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">Access Restricted</h3>
            <p class="text-gray-400 text-sm mb-6">
                This portal is exclusively for Anurag University students and staff. Please sign in with your <span
                    class="text-white font-mono bg-zinc-800 px-1 rounded">@anurag.edu.in</span> email.
            </p>
            <button onclick="document.getElementById('restriction-modal').style.display='none'"
                class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3 rounded-xl transition-colors border border-zinc-700">
                Understood
            </button>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-pages.js"></script>
</body>

</html>
